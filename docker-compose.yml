services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:vllm-arm64-cu13-0.25.1-7a33ba9}
    container_name: vllm-server
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    shm_size: "64gb"
    ports:
      - "${VLLM_PORT:-8000}:${VLLM_PORT:-8000}"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_MODEL_ID=${HF_MODEL_ID:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      - SERVED_MODEL_NAME=${SERVED_MODEL_NAME:-qwen3.6-35b}
      - VLLM_PORT=${VLLM_PORT:-8000}
      - KV_CACHE_DTYPE=${KV_CACHE_DTYPE:-auto}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-262144}
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS:-8192}
      - GPU_MEMORY_UTIL=${GPU_MEMORY_UTIL:-0.4}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-12}
      - VLLM_EXTRA_FLAGS=${VLLM_EXTRA_FLAGS:---no-enable-prefix-caching --reasoning-parser qwen3 --tool-call-parser qwen3_xml --enable-auto-tool-choice --attention-backend flashinfer --moe-backend marlin --enable-chunked-prefill --async-scheduling --load-format fastsafetensors}
      - VLLM_SPECULATIVE_TOKENS=${VLLM_SPECULATIVE_TOKENS:-3}
      - VLLM_ENABLE_THINKING_DEFAULT=${VLLM_ENABLE_THINKING_DEFAULT:-false}
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ./vllm-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped
    networks:
      - dgx-net

  # Dedicated OCR model: dots.mocr (~3B VLM specialized for document
  # parsing) served as a second vLLM instance alongside the main LLM.
  # Both share the DGX Spark's 128GB unified memory: qwen ~60GB
  # (weights + KV) + mocr ~13GB (weights + fixed 8GB KV) leaves
  # ~50GB for OS + OCR service.
  mocr:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:vllm-arm64-cu13-0.25.1-7a33ba9}
    container_name: mocr-server
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    shm_size: "16gb"
    ports:
      - "${MOCR_PORT:-8001}:${MOCR_PORT:-8001}"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_MODEL_ID=${MOCR_MODEL_ID:-binedge/dots.mocr-FP8}
      - SERVED_MODEL_NAME=${MOCR_SERVED_MODEL_NAME:-dots-mocr}
      - VLLM_PORT=${MOCR_PORT:-8001}
      - KV_CACHE_DTYPE=${MOCR_KV_CACHE_DTYPE:-auto}
      - MAX_MODEL_LEN=${MOCR_MAX_MODEL_LEN:-32768}
      - MAX_NUM_BATCHED_TOKENS=${MOCR_MAX_NUM_BATCHED_TOKENS:-16384}
      - GPU_MEMORY_UTIL=${MOCR_GPU_MEMORY_UTIL:-0.10}
      - MAX_NUM_SEQS=${MOCR_MAX_NUM_SEQS:-12}
      - VLLM_EXTRA_FLAGS=${MOCR_VLLM_EXTRA_FLAGS:---enable-prefix-caching --enable-chunked-prefill --chat-template-content-format string --kv-cache-memory-bytes 8589934592}
      - VLLM_LIMIT_MM_PER_PROMPT={"image":1}
      - VLLM_SPECULATIVE_TOKENS=0
      - VLLM_ENABLE_THINKING_DEFAULT=
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ./vllm-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MOCR_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped
    networks:
      - dgx-net

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    container_name: ocr-service
    ports:
      - "${OCR_PORT:-8010}:${OCR_PORT:-8010}"
    environment:
      - VLLM_BASE_URL=http://mocr:${MOCR_PORT:-8001}
      - VLLM_MODEL=${MOCR_SERVED_MODEL_NAME:-dots-mocr}
      - OCR_PORT=${OCR_PORT:-8010}
      - OCR_DPI=${OCR_DPI:-200}
      - OCR_MAX_TOKENS=${OCR_MAX_TOKENS:-16384}
      - OCR_TEMPERATURE=${OCR_TEMPERATURE:-0.1}
      - OCR_TOP_P=${OCR_TOP_P:-0.9}
      - OCR_MAX_CONCURRENT_PAGES=${OCR_MAX_CONCURRENT_PAGES:-12}
      - OCR_MAX_RETRIES=${OCR_MAX_RETRIES:-2}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-200}
      - OCR_MAX_FILE_SIZE_MB=${OCR_MAX_FILE_SIZE_MB:-100}
    depends_on:
      mocr:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dgx-net

networks:
  dgx-net:
    name: dgx-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DGX_NET_SUBNET:-10.10.99.0/24}
          gateway: ${DGX_NET_GATEWAY:-10.10.99.1}
